version: '3.8'

services:
  api:
    build: .
    container_name: enterprise_hr_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - ACTIVE_MODEL_VERSION=v2

  dashboard:
    build: .
    container_name: enterprise_hr_dashboard
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - api
